[versions]
kotlin = "2.3.21"
composeMultiplatform = "1.12.1"
material3 = "1.9.0"
coroutines = "1.11.0"
junit = "4.13.2"

[libraries]
compose-material3 = { group = "org.jetbrains.compose.material3", name = "material3", version.ref = "material3" }
kotlinx-coroutines-swing = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-swing", version.ref = "coroutines" }
junit = { group = "junit", name = "junit", version.ref = "junit" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
